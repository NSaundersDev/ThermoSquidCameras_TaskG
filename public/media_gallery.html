<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Gallery</title>
  <link rel="stylesheet" href="/css/media_gallery.css">
</head>
<body>
  <header>    <h1 style="margin-top:0.25em;" id="gallery-title">MEDIA GALLERY</h1>

    <a id="gallery-back" class="gallery-back my-link" href="media_gallery.html" hidden >
      <i class="fa fa-arrow-circle-left" aria-hidden="true"></i>
    Back to Sessions and Images</a>


    <p id="gallery-heading" class="gallery-heading" hidden></p>
    <nav>
      <input type="date" id="date-filter">
      <button id="refresh-images">Refresh</button>
      <button id="session-download" type="button" hidden>Download all</button>
      <button id="session-delete" type="button" hidden>Delete all</button>
    </nav>
  </header>
  <main>
    <div id="image-grid"></div>
  </main>
  <div id="modal" class="modal" style="padding:1em;padding-bottom:0.5em;padding-top:3em;">
    <span style="display:inline-flex;gap:0.1em;">
        <span>
          <img id="modal-image" src="" alt="Full-size image">
          <div class="modal-actions" style="margin-bottom:0;">
            <button id="modal-download">Download</button>
            <button id="modal-delete">Delete</button>
          </div>    
        </span>
        <span id="modal-close" class="modal-close">&times;</span>        
    </span>
  </div>
  <div id="status-message"></div>
  <script type="module" src="media_gallery.js"></script>
</body>
</html>

<style>
  .my-link {font-size:x-large;border-radius:4%;color:rgb(116, 188, 254);outline:none;padding:0.5em;
  }

  .my-link:hover {
    color: rgb(5, 134, 255);
    text-decoration: underline;
  }
</style>
